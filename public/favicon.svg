<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sky Above Me">
  <!-- Near-black sky base (matches the color-bg token #080a0a), rounded like the UI cards -->
  <rect width="64" height="64" rx="14" fill="#080a0a"/>

  <!-- Faint orbital arc sweeping behind the star (cyan object accent #4f9cab) -->
  <path d="M4 18 C 20 -2, 44 -2, 60 18" fill="none" stroke="#4f9cab" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Subtle reticle ring arc behind the central glyph (echoes the header reticle) -->
  <path d="M32 8 a 24 24 0 0 1 24 24" fill="none" stroke="#d8d3c4" stroke-width="1" stroke-linecap="round" opacity="0.16"/>

  <!-- Scattered star points: bone stars + a couple of cyan, at small sizes -->
  <circle cx="13" cy="31" r="1.3" fill="#d8d3c4" opacity="0.8"/>
  <circle cx="51" cy="11" r="1.6" fill="#73b9c9" opacity="0.9"/>
  <circle cx="57" cy="40" r="1.1" fill="#d8d3c4" opacity="0.6"/>
  <circle cx="10" cy="49" r="0.9" fill="#d8d3c4" opacity="0.5"/>
  <circle cx="45" cy="56" r="1.0" fill="#d8d3c4" opacity="0.5"/>
  <circle cx="23" cy="5" r="0.9" fill="#73b9c9" opacity="0.7"/>

  <!-- Central four-point star (the ✶ glyph motif) in bone -->
  <path d="M32 9 C34 25 39 30 55 32 C39 34 34 39 32 55 C30 39 25 34 9 32 C25 30 30 25 32 9 Z" fill="#d8d3c4"/>

  <!-- Amber instrument accent: a compact planet/dot -->
  <circle cx="51" cy="49" r="1.8" fill="#d6a84a" opacity="0.95"/>
</svg>